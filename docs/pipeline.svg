<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Screening pipeline: PHQ-9, domain classification, follow-up questions, depression assessment, care plan">
  <title>MindCare screening pipeline</title>
  <style>
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
    .sans { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .flow { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
    .node { opacity: 0; animation: pop .8s cubic-bezier(.22,1,.36,1) forwards; }
    .n1 { animation-delay: .1s; } .n2 { animation-delay: .35s; } .n3 { animation-delay: .6s; } .n4 { animation-delay: .85s; } .n5 { animation-delay: 1.1s; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .p2 { animation-delay: .48s; } .p3 { animation-delay: .96s; } .p4 { animation-delay: 1.44s; } .p5 { animation-delay: 1.92s; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>

  <rect width="1200" height="300" rx="20" fill="#f7f6f2"/>
  <rect x=".5" y=".5" width="1199" height="299" rx="19.5" fill="none" stroke="#e3e0d7"/>
  <text x="40" y="48" class="sans" font-size="12" font-weight="600" letter-spacing="2.2" fill="#1f5e4a">— HOW A SCREENING FLOWS</text>

  <!-- connectors -->
  <g stroke="#1f5e4a" stroke-width="2" fill="none">
    <path class="flow" d="M238 160 H262"/>
    <path class="flow" d="M466 160 H490"/>
    <path class="flow" d="M694 160 H718"/>
    <path class="flow" d="M922 160 H946"/>
  </g>
  <g fill="#1f5e4a">
    <path d="M262 154 l8 6 -8 6z"/><path d="M490 154 l8 6 -8 6z"/><path d="M718 154 l8 6 -8 6z"/><path d="M946 154 l8 6 -8 6z"/>
  </g>

  <!-- 1 PHQ-9 -->
  <g class="node n1">
    <rect x="40" y="80" width="198" height="160" rx="14" fill="#fff" stroke="#e3e0d7"/>
    <circle class="pulse" cx="64" cy="106" r="5" fill="#1f5e4a"/>
    <text x="78" y="111" class="sans" font-size="11" font-weight="600" letter-spacing="1.5" fill="#6b716c">STEP 1</text>
    <text x="60" y="148" class="serif" font-size="27" fill="#0f1210">PHQ-9</text>
    <text x="60" y="178" class="sans" font-size="13" fill="#4b514d">9 validated questions</text>
    <text x="60" y="198" class="sans" font-size="13" fill="#4b514d">Score 0–27</text>
    <text x="60" y="224" class="sans" font-size="11" font-weight="600" fill="#1f5e4a">Clinical standard</text>
  </g>

  <!-- 2 Domain -->
  <g class="node n2">
    <rect x="270" y="80" width="196" height="160" rx="14" fill="#fff" stroke="#e3e0d7"/>
    <circle class="pulse p2" cx="294" cy="106" r="5" fill="#1f5e4a"/>
    <text x="308" y="111" class="sans" font-size="11" font-weight="600" letter-spacing="1.5" fill="#6b716c">STEP 2</text>
    <text x="290" y="148" class="serif" font-size="27" fill="#0f1210">Focus area</text>
    <text x="290" y="178" class="sans" font-size="13" fill="#4b514d">One of 6 life areas:</text>
    <text x="290" y="198" class="sans" font-size="13" fill="#4b514d">work, studies, family…</text>
    <text x="290" y="224" class="sans" font-size="11" font-weight="600" fill="#1f5e4a">Fine-tuned RoBERTa</text>
  </g>

  <!-- 3 Questions -->
  <g class="node n3">
    <rect x="498" y="80" width="196" height="160" rx="14" fill="#fff" stroke="#e3e0d7"/>
    <circle class="pulse p3" cx="522" cy="106" r="5" fill="#1f5e4a"/>
    <text x="536" y="111" class="sans" font-size="11" font-weight="600" letter-spacing="1.5" fill="#6b716c">STEP 3</text>
    <text x="518" y="148" class="serif" font-size="27" fill="#0f1210">Conversation</text>
    <text x="518" y="178" class="sans" font-size="13" fill="#4b514d">5 personal follow-up</text>
    <text x="518" y="198" class="sans" font-size="13" fill="#4b514d">questions, own words</text>
    <text x="518" y="224" class="sans" font-size="11" font-weight="600" fill="#1f5e4a">Fine-tuned T5</text>
  </g>

  <!-- 4 Assessment -->
  <g class="node n4">
    <rect x="726" y="80" width="196" height="160" rx="14" fill="#fff" stroke="#e3e0d7"/>
    <circle class="pulse p4" cx="750" cy="106" r="5" fill="#1f5e4a"/>
    <text x="764" y="111" class="sans" font-size="11" font-weight="600" letter-spacing="1.5" fill="#6b716c">STEP 4</text>
    <text x="746" y="148" class="serif" font-size="27" fill="#0f1210">Assessment</text>
    <g class="sans" font-size="11" font-weight="600">
      <rect x="746" y="164" width="40" height="8" rx="4" fill="#1d7350"/>
      <rect x="790" y="164" width="40" height="8" rx="4" fill="#8f5f00"/>
      <rect x="834" y="164" width="40" height="8" rx="4" fill="#b0440a"/>
      <rect x="878" y="164" width="24" height="8" rx="4" fill="#efede6"/>
    </g>
    <text x="746" y="198" class="sans" font-size="13" fill="#4b514d">Level from your answers</text>
    <text x="746" y="224" class="sans" font-size="11" font-weight="600" fill="#1f5e4a">Gemini · PHQ-9 fallback</text>
  </g>

  <!-- 5 Care plan -->
  <g class="node n5">
    <rect x="954" y="80" width="206" height="160" rx="14" fill="#0f1210"/>
    <circle class="pulse p5" cx="978" cy="106" r="5" fill="#a9d3c2"/>
    <text x="992" y="111" class="sans" font-size="11" font-weight="600" letter-spacing="1.5" fill="#b9bfba">STEP 5</text>
    <text x="974" y="148" class="serif" font-size="27" fill="#fff">Care plan</text>
    <text x="974" y="178" class="sans" font-size="13" fill="#dfe9e4">Personal suggestions,</text>
    <text x="974" y="198" class="sans" font-size="13" fill="#dfe9e4">report, yoga, experts</text>
    <text x="974" y="224" class="sans" font-size="11" font-weight="600" fill="#a9d3c2">Fine-tuned T5</text>
  </g>
</svg>
